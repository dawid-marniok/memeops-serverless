# Wzorzec pipeline'u MemeOps dla GitHub Actions (skopiuj do .github/workflows/meme-gen.yml).
# Te same etapy co ci/pipeline.sh. Deploy wymaga dostępu do klastra:
#  - klaster w chmurze: kubeconfig/OIDC jako sekret,
#  - klaster lokalny (kind na VM): self-hosted runner na tej VM (runs-on: self-hosted) albo GitOps (Argo CD/Flux).
name: meme-gen
on:
  push:
    branches: [main]
    paths: [app/meme-gen/**]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/meme-gen
jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Akcje przypięte po SHA commita, nie po tagu (tagi trivy-action przepisano w ataku z 03.2026)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.12"}
      - name: test
        working-directory: app/meme-gen
        run: pip install pytest -r requirements.txt && python -m pytest -q
      - name: build
        run: docker build -f app/meme-gen/Dockerfile.slim -t $IMAGE:${{ github.sha }} app/meme-gen
      - name: scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE:${{ github.sha }}
      - name: deploy canary 10%
        if: false   # włącz, gdy runner ma dostęp do klastra (kubeconfig w sekrecie KUBECONFIG)
        run: |
          kn service update meme-gen -n memeops --image $IMAGE:${{ github.sha }} \
            --traffic @latest=10 --traffic "$(kubectl get ksvc meme-gen -n memeops -o jsonpath='{.status.latestReadyRevisionName}')=90" \
            --tag @latest=canary
