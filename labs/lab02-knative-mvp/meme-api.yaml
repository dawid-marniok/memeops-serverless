# LAB 2: MVP MemeOps jako Knative Service.
# Każda zmiana w spec.template tworzy nową, niezmienną rewizję.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: meme-api
  namespace: memeops
spec:
  template:
    metadata:
      name: meme-api-v1            # nazwa rewizji (opcjonalna, ale czytelna)
    spec:
      containers:
        - image: localhost:5001/meme-api:v1
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
