# Demo 04: funkcja wywoływana zdarzeniem, a nie żądaniem od użytkownika.
#   PingSource (co minutę) ─┐
#   curl z poda (ręcznie) ──┴→ Broker „default” → Trigger (filtr po typie) → funkcja mem-dnia
# Nadawca zna tylko adres brokera. Kto odbiera, decydują Triggery: nadawcy i odbiorcy nie wiedzą o sobie.
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: default
  namespace: demo
---
# Odbiorca: event_display z Knative wypisuje w logach każde otrzymane zdarzenie (CloudEvent).
# To zwykła usługa Knative, więc między zdarzeniami schodzi do zera.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mem-dnia
  namespace: demo
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/window: "10s"
    spec:
      timeoutSeconds: 15
      containers:
        - image: gcr.io/knative-releases/knative.dev/eventing/cmd/event_display@sha256:e991bf5c8c0d37ec1660eb8b340a893c2525ef5b35203ffc236ee39fb7edae6c
---
# Źródło zdarzeń: harmonogram. Co minutę wysyła do brokera zdarzenie typu dev.knative.sources.ping.
apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: mem-co-minute
  namespace: demo
spec:
  schedule: "* * * * *"
  contentType: application/json
  data: '{"top": "mem dnia", "bottom": "z harmonogramu"}'
  sink:
    ref: {apiVersion: eventing.knative.dev/v1, kind: Broker, name: default}
---
# Trigger 1: zdarzenia z harmonogramu → mem-dnia
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: harmonogram
  namespace: demo
spec:
  broker: default
  filter:
    attributes:
      type: dev.knative.sources.ping
  subscriber:
    ref: {apiVersion: serving.knative.dev/v1, kind: Service, name: mem-dnia}
---
# Trigger 2: zdarzenia „nowy mem” wysłane przez dowolną aplikację → też mem-dnia
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: nowy-mem
  namespace: demo
spec:
  broker: default
  filter:
    attributes:
      type: memeops.mem.nowy
  subscriber:
    ref: {apiVersion: serving.knative.dev/v1, kind: Service, name: mem-dnia}
