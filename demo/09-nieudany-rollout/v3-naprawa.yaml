# Demo 09, krok 4: naprawa. Nowa rewizja v3 bez błędnej komendy (obraz sam wie, jak wystartować).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rollout
  namespace: demo
spec:
  template:
    metadata:
      name: rollout-v3
      annotations:
        serving.knative.dev/progress-deadline: "45s"   # po ilu sekundach uznać rewizję za nieudaną (domyślnie 600 s)
    spec:
      timeoutSeconds: 15
      containers:
        - name: user-container
          image: localhost:5001/meme-api:v2
          readinessProbe:
            httpGet: {path: /healthz}
            successThreshold: 1
