# Demo 11, krok 2: worker. Zdejmuje jedno zadanie z listy i „generuje mema” przez CZAS sekund (domyślnie 1). Startuje z zerem replik.
# Pętla w args to sam program workera (prawdziwy worker byłby Twoją aplikacją).
apiVersion: apps/v1
kind: Deployment
metadata: {name: generator, namespace: demo}
spec:
  replicas: 0
  selector: {matchLabels: {app: generator}}
  template:
    metadata: {labels: {app: generator}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: generator
          image: redis:8.2-alpine          # ma redis-cli; prawdziwy worker byłby Twoją aplikacją
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                zadanie=$(redis-cli -h redis --raw BLPOP memy 5 | tail -1)
                [ -n "$zadanie" ] && { echo "$(hostname): generuję mem nr $zadanie"; sleep "${CZAS:-1}"; }
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
