# Demo 12, krok 2: ta sama prosta aplikacja HTTP dwa razy — jako moduł Wasm (Spin) i jako kontener Pythona.
# wasm-hello: runtimeClassName wskazuje Spin; obraz OCI zawiera moduł .wasm i spin.toml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wasm-hello
spec:
  replicas: 1
  selector: {matchLabels: {app: wasm-hello}}
  template:
    metadata: {labels: {app: wasm-hello}}
    spec:
      runtimeClassName: wasmtime-spin-v2
      containers:
        - name: hello
          image: ghcr.io/spinframework/containerd-shim-spin/examples/spin-rust-hello:v0.26.0
          command: ["/"]
          ports: [{containerPort: 80}]
---
# Dla porównania: ten sam „hello” jako kontener Pythona (obraz meme-api z rejestru memeops nie jest tu dostępny)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-hello
spec:
  replicas: 1
  selector: {matchLabels: {app: python-hello}}
  template:
    metadata: {labels: {app: python-hello}}
    spec:
      containers:
        - name: hello
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "80"]
          ports: [{containerPort: 80}]
