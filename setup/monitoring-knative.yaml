# Zbieranie metryk Knative przez Prometheus Operator + dashboard „MemeOps — funkcja Knative”.
# Nakładane przez setup/platform.sh --monitoring.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: knative-queue-proxy
  namespace: monitoring
spec:
  namespaceSelector: {any: true}
  selector:
    matchExpressions:
      - {key: serving.knative.dev/revision, operator: Exists}
  podMetricsEndpoints:
    - port: http-usermetric
      interval: 5s
      relabelings:
        - {sourceLabels: [__meta_kubernetes_pod_label_serving_knative_dev_revision], targetLabel: revision}
        - {sourceLabels: [__meta_kubernetes_pod_label_serving_knative_dev_service], targetLabel: service}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: knative-serving
  namespace: monitoring
spec:
  namespaceSelector: {matchNames: [knative-serving]}
  selector:
    matchExpressions:
      - {key: app, operator: In, values: [autoscaler, activator]}
  podMetricsEndpoints:
    - port: metrics
      interval: 5s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-memeops
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  memeops.json: |
    {
     "title": "MemeOps — funkcja Knative",
     "uid": "memeops-knative",
     "schemaVersion": 39,
     "refresh": "5s",
     "time": {
      "from": "now-15m",
      "to": "now"
     },
     "panels": [
      {
       "type": "timeseries",
       "title": "Pody na rewizję (faktyczne i pożądane)",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum by (kn_revision_name) (kn_revision_pods_count{kn_service_name=\"$service\"})",
         "legendFormat": "{{kn_revision_name}} — są",
         "refId": "A"
        },
        {
         "expr": "sum by (kn_revision_name) (kn_revision_pods_desired{kn_service_name=\"$service\"})",
         "legendFormat": "{{kn_revision_name}} — chce",
         "refId": "B"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Żądania na sekundę (per rewizja)",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum by (revision) (rate(http_server_request_duration_seconds_count{namespace=\"memeops\", service=\"$service\"}[1m]))",
         "legendFormat": "{{revision}}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Czas odpowiedzi p95 (queue-proxy)",
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "histogram_quantile(0.95, sum by (le, revision) (rate(http_server_request_duration_seconds_bucket{namespace=\"memeops\", service=\"$service\"}[1m])))",
         "legendFormat": "{{revision}} p95",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Kody odpowiedzi",
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum by (http_response_status_code) (rate(http_server_request_duration_seconds_count{namespace=\"memeops\", service=\"$service\"}[1m]))",
         "legendFormat": "{{http_response_status_code}}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Współbieżność: stabilna vs cel autoskalera",
       "gridPos": {
        "x": 0,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum by (kn_revision_name) (kn_revision_concurrency_stable{kn_service_name=\"$service\"})",
         "legendFormat": "{{kn_revision_name}} stable",
         "refId": "A"
        },
        {
         "expr": "sum by (kn_revision_name) (kn_revision_concurrency_panic{kn_service_name=\"$service\"})",
         "legendFormat": "{{kn_revision_name}} panic",
         "refId": "B"
        },
        {
         "expr": "max by (kn_revision_name) (kn_revision_concurrency_target{kn_service_name=\"$service\"})",
         "legendFormat": "{{kn_revision_name}} target",
         "refId": "C"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Restarty kontenera i OOMKilled",
       "gridPos": {
        "x": 12,
        "y": 16,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"memeops\", container=\"user-container\"}[5m]))",
         "legendFormat": "{{pod}} restarty/5 min",
         "refId": "A"
        },
        {
         "expr": "max by (pod) (kube_pod_container_status_last_terminated_reason{namespace=\"memeops\", reason=\"OOMKilled\"})",
         "legendFormat": "{{pod}} OOMKilled",
         "refId": "B"
        }
       ]
      }
     ],
     "templating": {
      "list": [
       {
        "name": "service",
        "type": "custom",
        "query": "meme-gen,meme-api",
        "current": {
         "text": "meme-gen",
         "value": "meme-gen"
        }
       }
      ]
     }
    }
